<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estudo de Classes CSS</title>

    <style>
        .titulo {
            color: green;
            text-align: center;
        }

        .caixa01 {
            background-color: darkolivegreen;
            border: 2px solid black;
            border-radius: 6px;
            padding: 20px;
            margin: 20px;
        }

        .caixa02 {
            background-color: darkgreen;
            border: 2px solid black;
            border-radius: 6px;
            padding: 20px;
            margin: 20px;
        }

        .paragrafo1 {
            color: azure;
            font-weight: bold;
        }

        .paragrafo2 {
            color: cornsilk;
            background-color: cadetblue;
            font-style: oblique;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1 class="titulo">Aprendendo Classes com CSS</h1>

    <div class="caixa01">
        <p class="paragrafo1">Este é o primeiro parágrafo.</p>
        <p class="paragrafo2">Este é o segundo parágrafo.</p>
    </div>

    <div class="caixa02">
        <p class="texto">Este é o terceiro parágrafo.</p>
    </div>

</body>
</html>
